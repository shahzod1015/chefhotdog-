<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEF Hotdog - Buyurtma Berish</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #fff3a8 30%, #aa771c 70%, #fcf6ba 100%);
            --gold-btn-grad: linear-gradient(180deg, #f7e089 0%, #c8962c 100%);
            --gold-border: 1px solid rgba(212, 175, 55, 0.4);
            --gold-text: #f5d061;
            --dark-bg: #0a0a0d;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: var(--dark-bg); color: #fff; padding: 12px; min-height: 100vh; }
        
        .header { text-align: center; margin-bottom: 20px; padding: 15px; background: rgba(18,18,18,0.9); border-radius: 16px; border: var(--gold-border); }
        .header img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #d4af37; object-fit: cover; margin-bottom: 8px; }
        .header h2 { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; }

        .section-title { color: var(--gold-text); font-size: 16px; margin: 15px 0 10px 0; font-weight: bold; }
        
        .form-control { width: 100%; padding: 12px; margin-bottom: 10px; background: #121215; border: var(--gold-border); border-radius: 10px; color: #fff; font-size: 14px; }
        
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .menu-card { background: #141418; border: var(--gold-border); border-radius: 12px; padding: 10px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .menu-card img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; }
        .menu-card h4 { font-size: 13px; margin-bottom: 4px; }
        .menu-card .price { color: var(--gold-text); font-weight: bold; font-size: 13px; margin-bottom: 8px; }
        
        .qty-box { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .qty-btn { width: 26px; height: 26px; background: #222; color: var(--gold-text); border: var(--gold-border); border-radius: 6px; font-weight: bold; cursor: pointer; }
        .qty-val { font-weight: bold; font-size: 14px; width: 20px; text-align: center; }

        .btn-add { background: var(--gold-btn-grad); color: #000; border: none; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 12px; width: 100%; cursor: pointer; }

        .order-btn { width: 100%; padding: 14px; background: var(--gold-btn-grad); color: #000; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; text-transform: uppercase; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(212,175,55,0.3); }

        /* MODAL (Qalqib chiquvchi to'lov oynasi) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: #121216; border: 2px solid #d4af37; border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; text-align: center; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { color: var(--gold-text); margin-bottom: 15px; }
        
        .pay-option-btn { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; font-weight: bold; border: var(--gold-border); cursor: pointer; font-size: 14px; }
        .btn-card { background: rgba(212,175,55,0.15); color: #fff; }
        .btn-qr { background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: #10b981; }
        .btn-cash { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: #3b82f6; }
        
        .qr-img { width: 200px; height: 200px; object-fit: contain; background: #fff; border-radius: 10px; margin: 10px auto; padding: 5px; }
        .close-modal { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://wrrsvrgdinfmnuwewtoa.supabase.co/storage/v1/object/public/menu-images/Untitled%20folder/content.png" alt="Logo">
        <h2>CHEF HOTDOG</h2>
        <p style="font-size: 12px; color: #aaa;">Mazali fast-fud va tezkor yetkazib berish</p>
    </div>

    <div class="section-title">👤 Ma'lumotlaringiz:</div>
    <input type="text" id="client-name" class="form-control" placeholder="Ismingizni kiriting">
    <input type="tel" id="client-phone" class="form-control" placeholder="Telefon raqamingiz (+998...)">
    <button onclick="getLocation()" class="form-control" style="background: rgba(212,175,55,0.1); color: var(--gold-text); font-weight: bold; cursor: pointer;">📍 Joylashuvni (GPS) yuborish</button>
    <div id="loc-status" style="font-size: 12px; color: #10b981; margin-bottom: 10px; text-align: center;"></div>

    <div class="section-title">🍽 Taomlar Menyu:</div>
    <div id="customer-menu-grid" class="menu-grid">Yuklanmoqda...</div>

    <button class="order-btn" onclick="openPaymentModal()">🛒 Buyurtma Berish va To'lash</button>

    <!-- TO'LOV MODAL OYNASI -->
    <div id="payment-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>💳 To'lov Turini Tanlang</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 15px;">Buyurtma summasi: <b id="modal-total-sum" style="color:var(--gold-text);">0 so'm</b></p>

            <button class="pay-option-btn btn-card" onclick="selectPaymentMethod('Karta')">💳 Karta raqam orqali to'lash</button>
            <button class="pay-option-btn btn-qr" onclick="selectPaymentMethod('QR Kod')">📷 QR Kod orqali to'lash</button>
            <button class="pay-option-btn btn-cash" onclick="selectPaymentMethod('Naqd Pul')">💵 Naqd pul (Kuryerga to'lash)</button>

            <!-- KARTA MALUMOTLARI QISMI -->
            <div id="card-info-box" style="display:none; background:#1a1a22; padding:12px; border-radius:10px; margin-top:10px; border:var(--gold-border);">
                <p style="font-size:12px; color:#aaa;">Ushbu karta raqamga pul o'tkazing va chekni yuboring:</p>
                <b id="disp-card-num" style="font-size:16px; color:var(--gold-text); display:block; margin:6px 0;">8600 0000 0000 0000</b>
                <span id="disp-card-holder" style="font-size:12px; color:#ccc;">Karta egasi: CHEF HOTDOG</span>
                <button onclick="finishOrderWithPayment('Karta orqali to\'landi')" class="order-btn" style="padding:10px; font-size:14px; margin-top:10px;">✅ Pulni o'tkazdim, Buyurtmani Tasdiqlash</button>
            </div>

            <!-- QR KOD QISMI -->
            <div id="qr-info-box" style="display:none; background:#1a1a22; padding:12px; border-radius:10px; margin-top:10px; border:var(--gold-border);">
                <p style="font-size:12px; color:#aaa;">Ilova orqali QR kodni skanerlang:</p>
                <img id="disp-qr-img" src="" class="qr-img" alt="QR Kod">
                <button onclick="finishOrderWithPayment('QR kod orqali to\'landi')" class="order-btn" style="padding:10px; font-size:14px; margin-top:10px;">✅ To'ladim, Buyurtmani Tasdiqlash</button>
            </div>

            <button class="close-modal" onclick="closePaymentModal()">Bekor qilish</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://wrrsvrgdinfmnuwewtoa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndycnN2cmdkaW5mbW51d2V3dG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzM0ODIsImV4cCI6MjEwMjU0OTQ4Mn0.YRHratsKVG42IY6YKokDycRy23oU8N3b7jO-o3tpQF4";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TELEGRAM_BOT_TOKEN = "8992397944:AAFPRv6NKFKn7dLz6hxBcLSqf93z5VfAvNs";
        const TELEGRAM_CHAT_ID = "8630700790";

        let clientCart = {}; 
        let clientLat = null;
        let clientLng = null;
        let paymentSettings = {};

        window.addEventListener('DOMContentLoaded', async () => {
            loadCustomerMenu();
            loadPaymentSettings();
        });

        async function loadPaymentSettings() {
            const { data } = await db.from('delivery_settings').select('*').maybeSingle();
            if(data) {
                paymentSettings = data; 
            }
        }

        async function loadCustomerMenu() {
            const { data: menu } = await db.from('menu').select('*').eq('is_stopped', false);
            let html = '';
            (menu || []).forEach(m => {
                if(!clientCart[m.id]) clientCart[m.id] = { ...m, qty: 0 };
                html += `
                <div class="menu-card">
                    <div>
                        <img src="${m.image_url || 'https://via.placeholder.com/150'}" alt="${m.title}">
                        <h4>${m.title}</h4>
                        <div class="price">${m.price.toLocaleString()} so'm</div>
                    </div>
                    <div>
                        <div class="qty-box">
                            <button class="qty-btn" onclick="changeCustomerQty(${m.id}, -1)">-</button>
                            <span class="qty-val" id="cust-qty-${m.id}">0</span>
                            <button class="qty-btn" onclick="changeCustomerQty(${m.id}, 1)">+</button>
                        </div>
                        <button class="btn-add" onclick="changeCustomerQty(${m.id}, 1)">Tanlash</button>
                    </div>
                </div>`;
            });
            document.getElementById('customer-menu-grid').innerHTML = html || '<p>Hozircha menyu bo\'sh.</p>';
        }

        function changeCustomerQty(id, delta) {
            if(!clientCart[id]) return;
            clientCart[id].qty += delta;
            if(clientCart[id].qty < 0) clientCart[id].qty = 0;
            document.getElementById(`cust-qty-${id}`).innerText = clientCart[id].qty;
        }

        function getLocation() {
            if (navigator.geolocation) {
                document.getElementById('loc-status').innerText = "📍 Joylashuv aniqlanmoqda...";
                navigator.geolocation.getCurrentPosition(pos => {
                    clientLat = pos.coords.latitude;
                    clientLng = pos.coords.longitude;
                    document.getElementById('loc-status').innerText = "✅ Joylashuv muvaffaqiyatli olindi!";
                }, () => {
                    alert("GPS joylashuvni aniqlab bo'lmadi. Iltimos, ruxsat bering.");
                    document.getElementById('loc-status').innerText = "❌ Xatolik yuz berdi.";
                });
            } else {
                alert("Brauzeringiz GPS-ni qo'llab-quvvatlamaydi.");
            }
        }

        function calculateCartTotal() {
            let total = 0;
            Object.values(clientCart).forEach(item => {
                if(item.qty > 0) total += item.price * item.qty;
            });
            return total;
        }

        function openPaymentModal() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const total = calculateCartTotal();

            if(!name || !phone) return alert("Iltimos, ismingiz va telefon raqamingizni kiriting!");
            if(total <= 0) return alert("Savatchada hech qanday taom tanlanmagan!");

            document.getElementById('modal-total-sum').innerText = total.toLocaleString() + " so'm";
            document.getElementById('payment-modal').style.display = 'flex';
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').style.display = 'none';
            document.getElementById('card-info-box').style.display = 'none';
            document.getElementById('qr-info-box').style.display = 'none';
        }

        function selectPaymentMethod(method) {
            document.getElementById('card-info-box').style.display = 'none';
            document.getElementById('qr-info-box').style.display = 'none';

            if(method === 'Karta') {
                document.getElementById('card-info-box').style.display = 'block';
                document.getElementById('disp-card-num').innerText = paymentSettings.card_number || "8600 1234 5678 9012";
                document.getElementById('disp-card-holder').innerText = "Karta egasi: " + (paymentSettings.card_holder || "CHEF HOTDOG");
            } else if(method === 'QR Kod') {
                document.getElementById('qr-info-box').style.display = 'block';
                document.getElementById('disp-qr-img').src = paymentSettings.qr_image_url || "https://via.placeholder.com/200?text=QR+Kod+Topilmadi";
            } else if(method === 'Naqd Pul') {
                finishOrderWithPayment('Naqd pul (Kuryerga)');
            }
        }

        async function finishOrderWithPayment(paymentType) {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();

            let orderItemsStr = [];
            let totalAmount = 0;
            let totalCost = 0;

            Object.values(clientCart).forEach(item => {
                if(item.qty > 0) {
                    orderItemsStr.push(`${item.title} (x${item.qty})`);
                    totalAmount += item.price * item.qty;
                    totalCost += (item.cost || 0) * item.qty;
                }
            });

            let statusText = `Mijoz: ${name} (${phone}) | ${orderItemsStr.join(', ')} | To'lov: ${paymentType}`;
            if(clientLat && clientLng) {
                statusText += ` | GPS: ${clientLat}, ${clientLng}`;
            }

            const isPaidOnline = paymentType.includes('to\'landi');
            
            const { error } = await db.from('sales').insert([{
                total_amount: totalAmount,
                total_cost: totalCost,
                profit: totalAmount - totalCost,
                status: statusText,
                is_paid: isPaidOnline 
            }]);

            if(error) {
                alert("Xatolik yuz berdi: " + error.message);
            } else {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: `🚀 <b>Yangi mijoz buyurtmasi!</b>\n\n👤 Ism: <b>${name}</b>\n📞 Tel: <b>${phone}</b>\n🍔 Buyurtma: ${orderItemsStr.join(', ')}\n💰 Summa: <b>${totalAmount.toLocaleString()} so'm</b>\n💳 To'lov turi: <b>${paymentType}</b>`,
                        parse_mode: 'HTML'
                    })
                });

                alert("✅ Buyurtmangiz muvaffaqiyatli qabul qilindi! Tez orada siz bilan bog'lanamiz.");
                location.reload();
            }
        }
    </script>
</body>
</html>
