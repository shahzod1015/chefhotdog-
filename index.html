<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEF Hotdog - Yetkazib berish</title>

    <!-- App Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/YFZh8t0q/content.png">
    <link rel="icon" type="image/png" href="https://i.ibb.co/YFZh8t0q/content.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- OpenStreetMap Leaflet Xarita JS va CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #fff3a8 30%, #aa771c 70%, #fcf6ba 100%);
            --gold-btn-grad: linear-gradient(180deg, #f7e089 0%, #c8962c 100%);
            --gold-border: 1px solid rgba(212, 175, 55, 0.4);
            --gold-border-thin: 1px solid rgba(212, 175, 55, 0.25);
            --gold-text: #f5d061;
            --card-bg: rgba(18, 18, 18, 0.9);
            --dark-bg: #0a0a0d;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            padding: 12px; 
            color: #f1f5f9; 
            min-height: 100vh;
            padding-bottom: 110px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 20px;
            border: var(--gold-border);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            margin-bottom: 16px;
            text-align: center;
        }

        .header img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .header h1 {
            font-size: 22px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 12px;
            color: #a1a1aa;
        }

        .pos-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            margin-bottom: 20px;
        }

        .pos-card { 
            border: var(--gold-border-thin); 
            border-radius: 16px; 
            padding: 10px; 
            text-align: center; 
            background: linear-gradient(180deg, rgba(22, 22, 25, 0.9) 0%, rgba(12, 12, 14, 0.95) 100%); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            position: relative;
        }

        .pos-card img { 
            width: 100%; 
            height: 110px; 
            object-fit: cover; 
            border-radius: 12px; 
            border: var(--gold-border-thin); 
            margin-bottom: 8px; 
        }

        .pos-card h4 { font-size: 13px; margin-bottom: 4px; color: #ffffff; font-weight: 700; }
        .pos-card .price { color: var(--gold-text); font-weight: 800; font-size: 14px; margin-bottom: 8px; }

        .qty-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
        .qty-btn { 
            width: 28px; height: 28px; background: rgba(35, 30, 20, 0.8); color: var(--gold-text); 
            border: var(--gold-border-thin); border-radius: 8px; font-weight: bold; cursor: pointer; 
        }

        .order-form {
            background: var(--card-bg);
            border: var(--gold-border-thin);
            border-radius: 18px;
            padding: 16px;
            margin-top: 10px;
        }

        .order-form h3 { color: var(--gold-text); font-size: 16px; margin-bottom: 12px; }

        input {
            width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px;
            border: var(--gold-border-thin); background: #08080a; color: #fff; font-size: 14px;
        }

        #map {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            border: var(--gold-border-thin);
            margin-bottom: 12px;
        }

        .delivery-info {
            background: rgba(212, 175, 55, 0.1);
            border: var(--gold-border-thin);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .delivery-info span { font-weight: bold; color: var(--gold-text); }

        .cart-bar {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(20, 20, 24, 0.95);
            border: var(--gold-border);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 9999;
        }

        .btn-submit {
            background: var(--gold-btn-grad);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
        }

        .is-stopped { opacity: 0.4; pointer-events: none; }
        .is-stopped::after {
            content: "STOP LIST"; position: absolute; top: 40%; left: 10%; right: 10%;
            background: #ef4444; color: #fff; font-size: 11px; font-weight: 900; padding: 4px; border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://i.ibb.co/YFZh8t0q/content.png" alt="CHEF Hotdog">
        <h1>CHEF HOTDOG</h1>
        <p>🚀 Onlayn buyurtma va tezkor yetkazib berish</p>
    </div>

    <h3 style="color:var(--gold-text); margin-bottom: 10px;">🍽 Menyuni Tanlang:</h3>
    <div id="delivery-menu" class="pos-grid">Yuklanmoqda...</div>

    <div class="order-form">
        <h3>📍 Yetkazib berish manzili:</h3>
        
        <input type="text" id="cust-name" placeholder="Ismingiz" required>
        <input type="tel" id="cust-phone" placeholder="Telefon raqamingiz (+998 ...)" required>
        
        <p style="font-size:12px; color:#a1a1aa; margin-bottom: 6px;">Manzilingizni xaritadan tanlang:</p>
        <div id="map"></div>
        
        <div class="delivery-info">
            Masofa: <span id="del-distance">0 km</span> | 
            Dostavka narxi: <span id="del-price">0 so'm</span>
        </div>

        <input type="text" id="cust-address" placeholder="Tanlangan joylashuv koordinatasi" readonly>
    </div>

    <div class="cart-bar">
        <div>
            <div style="font-size:11px; color:#a1a1aa;">Jami summa (Taom + Dostavka):</div>
            <div id="cart-total" style="font-size:18px; font-weight:900; color:var(--gold-text);">0 so'm</div>
        </div>
        <button class="btn-submit" id="btn-submit-order" onclick="sendDeliveryOrder()">Buyurtma berish 🚀</button>
    </div>

    <script>
        const SUPABASE_URL = "https://wrrsvrgdinfmnuwewtoa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndycnN2cmdkaW5mbW51d2V3dG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzM0ODIsImV4cCI6MjEwMjU0OTQ4Mn0.YRHratsKVG42IY6YKokDycRy23oU8N3b7jO-o3tpQF4";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // RESTORAN SOZLAMALARI (SHU YERDAN O'ZGARTIRISHINGIZ MUMKIN)
        const RESTORAN_LAT = 38.849464;
        const RESTORAN_LNG = 65.793417;
        const MAX_DELIVERY_KM = 2;       // Maksimal yetkazib berish masofasi (KM)
        const BASE_KM = 3;                // Dastlabki bepul yoki bazaviy km
        const BASE_DELIVERY_PRICE = 10000;// Dastlabki 3 km uchun narx
        const PER_KM_PRICE = 2000;        // 3 km dan keyingi har bir km uchun qo'shimcha narx

        let cart = {};
        let menuItems = [];
        let map, marker, restMarker, deliveryCircle;
        let selectedLat = RESTAURANT_LAT, selectedLng = RESTAURANT_LNG;
        let currentDeliveryFee = 0;
        let isWithinZone = true;

        // IKKITA GPS NUKTA ORASIDAGI MASOFANI HISOBASH (KM)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Yer radiusi km da
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // DOSTAVKA NARXINI HISOBLASH
        function updateDeliveryFee(lat, lng) {
            const distance = calculateDistance(RESTAURANT_LAT, RESTAURANT_LNG, lat, lng);
            document.getElementById('del-distance').innerText = distance.toFixed(1) + " km";

            if (distance > MAX_DELIVERY_KM) {
                isWithinZone = false;
                currentDeliveryFee = 0;
                document.getElementById('del-price').innerText = "🚫 Hududdan tashqarida";
                document.getElementById('del-price').style.color = "#ef4444";
            } else {
                isWithinZone = true;
                if (distance <= BASE_KM) {
                    currentDeliveryFee = BASE_DELIVERY_PRICE;
                } else {
                    const extraKm = Math.ceil(distance - BASE_KM);
                    currentDeliveryFee = BASE_DELIVERY_PRICE + (extraKm * PER_KM_PRICE);
                }
                document.getElementById('del-price').innerText = currentDeliveryFee.toLocaleString() + " so'm";
                document.getElementById('del-price').style.color = "#f5d061";
            }

            calculateTotal();
        }

        function initMap() {
            map = L.map('map').setView([RESTAURANT_LAT, RESTAURANT_LNG], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Restoran belgisi va Yetkazib berish zonasi doirasi
            restMarker = L.marker([RESTAURANT_LAT, RESTAURANT_LNG]).addTo(map)
                .bindPopup('<b>CHEF HOTDOG RESTORANI</b>').openPopup();

            deliveryCircle = L.circle([RESTAURANT_LAT, RESTAURANT_LNG], {
                color: '#d4af37',
                fillColor: '#d4af37',
                fillOpacity: 0.15,
                radius: MAX_DELIVERY_KM * 1000 // metrda
            }).addTo(map);

            // Mijoz belgisi
            marker = L.marker([RESTAURANT_LAT, RESTAURANT_LNG], {draggable: true}).addTo(map);

            function updateCoords(lat, lng) {
                selectedLat = lat;
                selectedLng = lng;
                document.getElementById('cust-address').value = `GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                updateDeliveryFee(lat, lng);
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const { latitude, longitude } = pos.coords;
                    marker.setLatLng([latitude, longitude]);
                    updateCoords(latitude, longitude);
                });
            } else {
                updateCoords(RESTAURANT_LAT, RESTAURANT_LNG);
            }

            map.on('click', function(e) {
                marker.setLatLng(e.latlng);
                updateCoords(e.latlng.lat, e.latlng.lng);
            });

            marker.on('dragend', function() {
                const coord = marker.getLatLng();
                updateCoords(coord.lat, coord.lng);
            });
        }

        async function loadMenu() {
            const { data, error } = await db.from('menu').select('*');
            if(error) return alert("Menyu yuklanmadi");

            menuItems = data || [];
            let stopList = JSON.parse(localStorage.getItem('chef_stop_list')) || [];
            let html = '';

            menuItems.forEach(item => {
                const isStopped = stopList.includes(item.id);
                cart[item.id] = 0;

                html += `
                <div class="pos-card ${isStopped ? 'is-stopped' : ''}">
                    <div>
                        <img src="${item.image_url || 'https://via.placeholder.com/150'}" alt="${item.title}">
                        <h4>${item.title}</h4>
                        <div class="price">${item.price.toLocaleString()} so'm</div>
                    </div>
                    <div>
                        <div class="qty-box">
                            <button class="qty-btn" onclick="updateCart(${item.id}, -1)">-</button>
                            <span id="qty-${item.id}" style="font-weight:bold;">0</span>
                            <button class="qty-btn" onclick="updateCart(${item.id}, 1)">+</button>
                        </div>
                    </div>
                </div>`;
            });

            document.getElementById('delivery-menu').innerHTML = html;
        }

        function updateCart(id, change) {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] < 0) cart[id] = 0;

            document.getElementById(`qty-${id}`).innerText = cart[id];
            calculateTotal();
        }

        function calculateTotal() {
            let foodTotal = 0;
            menuItems.forEach(item => {
                if (cart[item.id]) {
                    foodTotal += cart[item.id] * item.price;
                }
            });

            const grandTotal = foodTotal > 0 ? (foodTotal + currentDeliveryFee) : 0;
            document.getElementById('cart-total').innerText = grandTotal.toLocaleString() + " so'm";
        }

        async function sendDeliveryOrder() {
            if (!isWithinZone) {
                return alert("Kechirasiz, tanlangan manzil bizning yetkazib berish hududimizdan tashqarida (Maksimal radius: " + MAX_DELIVERY_KM + " km)!");
            }

            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value;

            if (!name || !phone) {
                return alert("Iltimos, ismingiz va telefon raqamingizni kiriting!");
            }

            let orderItemsStr = [];
            let foodAmount = 0;
            let totalCost = 0;

            menuItems.forEach(item => {
                const qty = cart[item.id] || 0;
                if (qty > 0) {
                    orderItemsStr.push(`${item.title} (x${qty})`);
                    foodAmount += item.price * qty;
                    totalCost += (item.cost || 0) * qty;
                }
            });

            if (orderItemsStr.length === 0) {
                return alert("Kamida bitta taom tanlang!");
            }

            const grandTotal = foodAmount + currentDeliveryFee;
            const statusText = `🛵 YETKAZISH: ${name} (${phone}) | Manzil: ${address} | Dostavka: ${currentDeliveryFee.toLocaleString()} so'm | Taomlar: ${orderItemsStr.join(', ')}`;

            const { error } = await db.from('sales').insert([{
                total_amount: grandTotal,
                total_cost: totalCost,
                profit: grandTotal - totalCost,
                status: statusText
            }]);

            if (error) {
                alert("Buyurtma yuborishda xatolik: " + error.message);
            } else {
                alert("✅ Buyurtmangiz qabul qilindi! Tez orada aloqaga chiqamiz.");
                location.reload();
            }
        }

        window.onload = () => {
            loadMenu();
            initMap();
        };
    </script>
</body>
</html>
