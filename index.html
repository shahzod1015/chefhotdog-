<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEF Hotdog - Yetkazib berish</title>

    <!-- App Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/YFZh8t0q/content.png">
    <link rel="icon" type="image/png" href="https://i.ibb.co/YFZh8t0q/content.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- OpenStreetMap Leaflet Xarita JS va CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #fff3a8 30%, #aa771c 70%, #fcf6ba 100%);
            --gold-btn-grad: linear-gradient(180deg, #f7e089 0%, #c8962c 100%);
            --gold-border: 1px solid rgba(212, 175, 55, 0.4);
            --gold-border-thin: 1px solid rgba(212, 175, 55, 0.25);
            --gold-text: #f5d061;
            --card-bg: rgba(18, 18, 18, 0.9);
            --dark-bg: #0a0a0d;
            --blue-accent: #3B82F6;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            padding: 12px; 
            color: #f1f5f9; 
            min-height: 100vh;
            padding-bottom: 120px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 20px;
            border: var(--gold-border);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            margin-bottom: 16px;
            text-align: center;
        }

        .header img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .header h1 {
            font-size: 22px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 12px;
            color: #a1a1aa;
        }

        .min-order-info {
            background: rgba(59, 130, 246, 0.12) !important;
            border: 1px solid var(--blue-accent) !important;
            padding: 12px !important;
            border-radius: 14px !important;
            text-align: center !important;
            font-size: 14px !important;
            color: var(--blue-accent) !important;
            margin-bottom: 16px !important;
            font-weight: 700 !important;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.25) !important;
        }

        .min-order-info b { color: var(--blue-accent) !important; }

        .pos-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            margin-bottom: 20px;
        }

        .pos-card { 
            border: var(--gold-border-thin); 
            border-radius: 16px; 
            padding: 10px; 
            text-align: center; 
            background: linear-gradient(180deg, rgba(22, 22, 25, 0.9) 0%, rgba(12, 12, 14, 0.95) 100%); 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            position: relative;
        }

        .pos-card img { 
            width: 100%; 
            height: 110px; 
            object-fit: cover; 
            border-radius: 12px; 
            border: var(--gold-border-thin); 
            margin-bottom: 8px; 
        }

        .pos-card h4 { font-size: 13px; margin-bottom: 4px; color: #ffffff; font-weight: 700; }
        .pos-card .price { color: var(--gold-text); font-weight: 800; font-size: 14px; margin-bottom: 8px; }

        .qty-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
        .qty-btn { 
            width: 28px; height: 28px; background: rgba(35, 30, 20, 0.8); color: var(--gold-text); 
            border: var(--gold-border-thin); border-radius: 8px; font-weight: bold; cursor: pointer; 
        }

        .order-form {
            background: var(--card-bg);
            border: var(--gold-border-thin);
            border-radius: 18px;
            padding: 16px;
            margin-top: 10px;
        }

        .order-form h3 { color: var(--gold-text); font-size: 16px; margin-bottom: 12px; }

        input {
            width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px;
            border: var(--gold-border-thin); background: #08080a; color: #fff; font-size: 14px;
        }

        #map {
            width: 100%;
            height: 280px;
            border-radius: 12px;
            border: var(--gold-border-thin);
            margin-bottom: 12px;
            z-index: 1;
        }

        .zone-label-1 {
            background: rgba(16, 185, 129, 0.95);
            border: 1px solid #10b981;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            border-radius: 8px;
            padding: 3px 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        .zone-label-2 {
            background: rgba(239, 68, 68, 0.95);
            border: 1px solid #ef4444;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            border-radius: 8px;
            padding: 3px 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        .cart-bar {
            position: fixed;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(20, 20, 24, 0.95);
            border: var(--gold-border);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 9999;
        }

        .btn-submit {
            background: var(--gold-btn-grad);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
        }

        .is-stopped { opacity: 0.4; pointer-events: none; }
        .is-stopped::after {
            content: "STOP LIST"; position: absolute; top: 40%; left: 10%; right: 10%;
            background: #ef4444; color: #fff; font-size: 11px; font-weight: 900; padding: 4px; border-radius: 6px;
        }

        .zone-badge-box {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .zone-badge {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }

        .cafe-marker-icon {
            border-radius: 50%;
            border: 2px solid #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- HEADER LOGO -->
    <div class="header">
        <img src="https://i.ibb.co/YFZh8t0q/content.png" alt="CHEF Hotdog">
        <h1>CHEF HOTDOG</h1>
        <p>🚀 Onlayn buyurtma va tezkor yetkazib berish</p>
    </div>

    <!-- MINIMUM LIMIT BILDIRISHNOMASI -->
    <div class="min-order-info">
        ⚠️ Eng kam buyurtma summasi: <b>48 000 so'm</b>
    </div>

    <!-- TAOMLAR MENYUSI -->
    <h3 style="color:var(--gold-text); margin-bottom: 10px;">🍽 Menyuni Tanlang:</h3>
    <div id="delivery-menu" class="pos-grid">Yuklanmoqda...</div>

    <!-- MA'LUMOTLAR VA XARITA FORMASI -->
    <div class="order-form">
        <h3>📍 Yetkazib berish manzili:</h3>
        
        <input type="text" id="cust-name" placeholder="Ismingiz" required>
        <input type="tel" id="cust-phone" placeholder="Telefon raqamingiz (+998 ...)" required>
        
        <div class="zone-badge-box">
            <div class="zone-badge" style="background:rgba(16, 185, 129, 0.15); border:1px solid #10b981; color:#10b981;">
                🟢 1-Zona: <span id="z1-badge-info">...</span>
            </div>
            <div class="zone-badge" style="background:rgba(239, 68, 68, 0.15); border:1px solid #ef4444; color:#ef4444;">
                🔴 2-Zona: <span id="z2-badge-info">...</span>
            </div>
        </div>

        <p style="font-size:12px; color:#a1a1aa; margin-bottom: 6px;">Joylashuvingizni xaritadan belgilang:</p>
        <div id="map"></div>
        <input type="text" id="cust-address" placeholder="Tanlangan joylashuv koordinatasi" readonly>
    </div>

    <!-- CART BOTTOM BAR -->
    <div class="cart-bar">
        <div>
            <div style="font-size:11px; color:#a1a1aa;">Jami taomlar: <span id="food-total">0</span> so'm</div>
            <div style="font-size:11px; color:#a1a1aa;">Dostavka: <span id="delivery-cost">0</span> so'm</div>
            <div id="cart-total" style="font-size:17px; font-weight:900; color:var(--gold-text);">0 so'm</div>
        </div>
        <button class="btn-submit" onclick="sendDeliveryOrder()">Buyurtma berish 🚀</button>
    </div>

    <script>
        const SUPABASE_URL = "https://wrrsvrgdinfmnuwewtoa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndycnN2cmdkaW5mbW51d2V3dG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzM0ODIsImV4cCI6MjEwMjU0OTQ4Mn0.YRHratsKVG42IY6YKokDycRy23oU8N3b7jO-o3tpQF4";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const MIN_ORDER_AMOUNT = 48000;
        const CAFE_LOGO_URL = "https://i.ibb.co/YFZh8t0q/content.png";

        let cart = {};
        let menuItems = [];
        let map, userMarker, cafeMarker, circle1, circle2;

        // KAFE KOORDINATASI (Majburiy biriktirildi)
        const cafeLat = 38.849449, cafeLng = 65.793410; 
        
        let zone1Km = 0.7, zone1Price = 5000;
        let zone2Km = 2.0, zone2Price = 10000;

        let selectedLat = cafeLat, selectedLng = cafeLng;
        let currentDeliveryFee = 0;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function updateDeliveryFee(lat, lng) {
            const dist = calculateDistance(cafeLat, cafeLng, lat, lng);
            if (dist <= zone1Km) {
                currentDeliveryFee = zone1Price;
            } else if (dist <= zone2Km) {
                currentDeliveryFee = zone2Price;
            } else {
                currentDeliveryFee = zone2Price;
            }
            document.getElementById('delivery-cost').innerText = currentDeliveryFee.toLocaleString();
            calculateTotal();
        }

        async function initMapAndSettings() {
            try {
                const { data: set } = await db.from('delivery_settings').select('*').maybeSingle();
                if (set) {
                    zone1Km = set.zone1_km || zone1Km;
                    zone1Price = set.zone1_price || zone1Price;
                    zone2Km = set.zone2_km || zone2Km;
                    zone2Price = set.zone2_price || zone2Price;
                }
            } catch(e) { console.log(e); }

            document.getElementById('z1-badge-info').innerText = `${zone1Km}km (${zone1Price.toLocaleString()} so'm)`;
            document.getElementById('z2-badge-info').innerText = `${zone2Km}km (${zone2Price.toLocaleString()} so'm)`;

            selectedLat = cafeLat;
            selectedLng = cafeLng;

            map = L.map('map').setView([cafeLat, cafeLng], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // 1-ZONA (Yashil doira)
            circle1 = L.circle([cafeLat, cafeLng], {
                color: '#10b981',
                fillColor: '#10b981',
                fillOpacity: 0.15,
                radius: zone1Km * 1000
            }).addTo(map);

            // 1-Zona yozuvi
            const zone1TopLat = cafeLat + (zone1Km / 111.32);
            L.marker([zone1TopLat, cafeLng], {
                icon: L.divIcon({
                    className: '',
                    html: `<div class="zone-label-1">🟢 1-Zona: ${zone1Price.toLocaleString()} so'm</div>`,
                    iconSize: [130, 24],
                    iconAnchor: [65, 12]
                })
            }).addTo(map);

            // 2-ZONA (Qizil doira)
            circle2 = L.circle([cafeLat, cafeLng], {
                color: '#ef4444',
                fillColor: '#ef4444',
                fillOpacity: 0.08,
                radius: zone2Km * 1000
            }).addTo(map);

            // 2-Zona yozuvi (qizil doiraning yuqori chetida)
            const zone2TopLat = cafeLat + (zone2Km / 111.32);
            L.marker([zone2TopLat, cafeLng], {
                icon: L.divIcon({
                    className: '',
                    html: `<div class="zone-label-2">🔴 2-Zona: ${zone2Price.toLocaleString()} so'm</div>`,
                    iconSize: [130, 24],
                    iconAnchor: [65, 12]
                })
            }).addTo(map);

            // Kafe logotipi uchun maxsus icon
            const cafeIcon = L.icon({
                iconUrl: CAFE_LOGO_URL,
                iconSize: [40, 40],
                iconAnchor: [20, 20],
                popupAnchor: [0, -22],
                className: 'cafe-marker-icon'
            });

            // Kafe markazi va popup ichidagi logotip (Burger emojisi olib tashlandi)
            cafeMarker = L.marker([cafeLat, cafeLng], { icon: cafeIcon }).addTo(map)
                .bindPopup(`
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px;">
                        <img src="${CAFE_LOGO_URL}" style="width: 26px; height: 26px; border-radius: 50%; border: 1px solid #d4af37; object-fit: cover;">
                        <b style="color: #111;">CHEF Hotdog Kafe</b>
                    </div>
                `);

            // Mijoz belgisi
            userMarker = L.marker([cafeLat, cafeLng], { draggable: true }).addTo(map);

            function updateCoords(lat, lng) {
                selectedLat = lat;
                selectedLng = lng;
                document.getElementById('cust-address').value = `GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
                updateDeliveryFee(lat, lng);
            }

            updateCoords(cafeLat, cafeLng);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const { latitude, longitude } = pos.coords;
                    map.setView([latitude, longitude], 15);
                    userMarker.setLatLng([latitude, longitude]);
                    updateCoords(latitude, longitude);
                }, () => {});
            }

            map.on('click', function(e) {
                userMarker.setLatLng(e.latlng);
                updateCoords(e.latlng.lat, e.latlng.lng);
            });

            userMarker.on('dragend', function(e) {
                const coord = userMarker.getLatLng();
                updateCoords(coord.lat, coord.lng);
            });
        }

        async function loadMenu() {
            const { data, error } = await db.from('menu').select('*');
            if(error) return alert("Menyu yuklanmadi");

            menuItems = data || [];
            let stopList = JSON.parse(localStorage.getItem('chef_stop_list')) || [];
            let html = '';

            menuItems.forEach(item => {
                const isStopped = stopList.includes(item.id);
                cart[item.id] = 0;

                html += `
                <div class="pos-card ${isStopped ? 'is-stopped' : ''}">
                    <div>
                        <img src="${item.image_url || 'https://via.placeholder.com/150'}" alt="${item.title}">
                        <h4>${item.title}</h4>
                        <div class="price">${item.price.toLocaleString()} so'm</div>
                    </div>
                    <div>
                        <div class="qty-box">
                            <button class="qty-btn" onclick="updateCart(${item.id}, -1)">-</button>
                            <span id="qty-${item.id}" style="font-weight:bold;">0</span>
                            <button class="qty-btn" onclick="updateCart(${item.id}, 1)">+</button>
                        </div>
                    </div>
                </div>`;
            });

            document.getElementById('delivery-menu').innerHTML = html;
        }

        function updateCart(id, change) {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] < 0) cart[id] = 0;

            document.getElementById(`qty-${id}`).innerText = cart[id];
            calculateTotal();
        }

        function calculateTotal() {
            let foodTotal = 0;
            menuItems.forEach(item => {
                if (cart[item.id]) {
                    foodTotal += cart[item.id] * item.price;
                }
            });

            document.getElementById('food-total').innerText = foodTotal.toLocaleString();
            
            const grandTotal = foodTotal + (foodTotal > 0 ? currentDeliveryFee : 0);
            document.getElementById('cart-total').innerText = grandTotal.toLocaleString() + " so'm";
            return foodTotal;
        }

        async function sendDeliveryOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value;

            if (!name || !phone) {
                return alert("Iltimos, ismingiz va telefon raqamingizni kiriting!");
            }

            let orderItemsStr = [];
            let totalFoodAmount = 0;
            let totalCost = 0;

            menuItems.forEach(item => {
                const qty = cart[item.id] || 0;
                if (qty > 0) {
                    orderItemsStr.push(`${item.title} (x${qty})`);
                    totalFoodAmount += item.price * qty;
                    totalCost += (item.cost || 0) * qty;
                }
            });

            if (orderItemsStr.length === 0) {
                return alert("Kamida bitta taom tanlang!");
            }

            if (totalFoodAmount < MIN_ORDER_AMOUNT) {
                const needed = MIN_ORDER_AMOUNT - totalFoodAmount;
                return alert(`⚠️ Eng kam yetkazib berish summasi ${MIN_ORDER_AMOUNT.toLocaleString()} so'm!\n\nTaomlar summasi: ${totalFoodAmount.toLocaleString()} so'm.\nYana ${needed.toLocaleString()} so'mlik taom qo'shing.`);
            }

            const grandTotal = totalFoodAmount + currentDeliveryFee;
            const statusText = `🛵 YETKAZISH: ${name} (${phone}) | Manzil: ${address} | Dostavka: ${currentDeliveryFee.toLocaleString()} so'm | Taomlar: ${orderItemsStr.join(', ')}`;

            const { error } = await db.from('sales').insert([{
                total_amount: grandTotal,
                total_cost: totalCost,
                profit: grandTotal - totalCost,
                status: statusText
            }]);

            if (error) {
                alert("Buyurtma yuborishda xatolik: " + error.message);
            } else {
                alert("✅ Buyurtmangiz qabul qilindi! Tez orada aloqaga chiqamiz.");
                location.reload();
            }
        }

        window.onload = () => {
            loadMenu();
            initMapAndSettings();
        };
    </script>
</body>
</html>
